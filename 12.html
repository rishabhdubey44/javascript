<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter </title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            gap: 50px;
        }
        
        .btn1,.btn2,.btn3,.btn4{
            padding: 6px 20px;
            color: white;
            border-radius: 10px;

        }
        .btn1{
            background-color: green;
        }
        .btn2{
            background-color:red;
        }
        .btn3{
            background-color:orange;
        }
        .btn4{
            background-color:gray;
        }
        
    </style>
</head>

<body>
    <h1>Counter App</h1>
    <h2 style="color: blue;">0</h2>
    <div class="buttons">
        <button class="btn1">Start</button>
        <button class="btn2">Stop</button>
        <button class="btn3">Resume</button>
        <button class="btn4">Reset</button>
    </div>

    <script>
        let count=0;
        clock=null;
        function  updatecount(){
            let h2=document.querySelector("h2");
            console.log(h2.innerText);
            h2.innerText=count;
        }
        function start(){
            clock=setInterval(()=>{
                count+=1;
                updatecount();
            }
            ,2000)
        }
        let startbtn=  document.querySelector(".btn1");
        startbtn.addEventListener("click",start);
        function stop(){
            clearInterval(clock);
        }
        let stopbtn= document.querySelector(".btn2");
        stopbtn.addEventListener("click",stop)

        function resume(){
            if(clock!=null && clock!=0){
                start();
            }
            return;

        }
        let reseumebtn=document.querySelector(".btn3");
        reseumebtn.addEventListener("click",resume);
        function reset(){
            count=0;
            updatecount();
            stop();

        }
        let resetbtn= document.querySelector(".btn4");
        resetbtn.addEventListener("click",reset)
    </script>
</body>

</html>
