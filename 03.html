<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Element</title>
</head>

<body>
    <h1>DOM part 2</h1>
    <p>This is the use of createElement()</p>
    <div class="container">
        <!-- APPEND NEW ITEMS HERE-->
    </div>
    <button id="btn">Add new item</button>
    <script>
        function addNewParaElement() {
            let newParaElement = document.createElement("p");
            newParaElement.innerText = "new Item added successfully";

            let containerDiv = document.querySelector(".container");
            containerDiv.appendChild(newParaElement);
        }
        let btn = document.querySelector("#btn");
        btn.addEventListener("click", addNewParaElement);
    </script>
</body>

</html>
